<!doctype html>
<html lang="fa" dir="rtl" data-type="service" data-radius="soft">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>چقدر مونده تا ببینمت؟</title>
    <meta name="description" content="لحظه‌شماری تا ساعت ۱۲:۰۵ روز ۲۴ نوامبر؛ وقتی که می‌بینمت و فاصله‌مون تموم می‌شه.">
    <meta name="site-kind" content="other">
    <meta name="page-type" content="service">
    <meta name="theme-color" content="#351a2b">
  </head>
  <body>
    <main class="countdown-page" aria-labelledby="countdown-title">
      <div class="countdown-shell">
        <header class="countdown-heading">
          <p class="countdown-kicker">تا بغلت کنم</p>
          <h1 id="countdown-title">فقط این‌قدر مونده</h1>
          <p>هر ثانیه که کم می‌شه، یه قدم به دیدنت و محکم بغلت کردن نزدیک‌تر می‌شم.</p>
        </header>

        <section class="countdown" role="timer" aria-label="زمان مونده تا دیدنت">
          <div class="time-unit">
            <strong data-countdown-days>۰۰</strong>
            <span>روز</span>
          </div>
          <div class="time-unit">
            <strong data-countdown-hours>۰۰</strong>
            <span>ساعت</span>
          </div>
          <div class="time-unit">
            <strong data-countdown-minutes>۰۰</strong>
            <span>دقیقه</span>
          </div>
          <div class="time-unit">
            <strong data-countdown-seconds>۰۰</strong>
            <span>ثانیه</span>
          </div>
        </section>

        <footer class="countdown-footer">
          <p>این عددها فقط تا دوازده‌وپنج مهمن؛ بعدش دیگه تو جلوی چشممی و هیچ فاصله‌ای بینمون نمی‌مونه.</p>
          <time datetime="2026-11-24T12:05:00+03:30">سه‌شنبه، ۳ آذر · ساعت ۱۲:۰۵</time>
        </footer>
      </div>
    </main>

    <script type="module" src="/src/countdown.ts"></script>
  </body>
</html>
